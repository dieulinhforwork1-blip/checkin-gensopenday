box(.3,.35,.3,.35,.18,-3.1,M.bld,gA);
box(.4,.3,.4,-3.5,.15,-7.9,M.bld,gA);
box(.9,1.1,.9,4.1,.55,-7,M.tall,gA);
box(.4,.3,.4,-2.1,.15,.3,M.bld,gA);
box(.4,.25,.4,-.6,.12,5.1,M.bld,gA);
var stad=new THREE.Mesh(new THREE.CylinderGeometry(.95,1.1,.4,40),M.bld);stad.position.set(-8,.2,-11.5);gA.add(stad);

var routeObjs={};
Object.keys(ROUTES).forEach(function(k){
  var r=ROUTES[k],g=new THREE.Group(),m=M[k==='a'?'ra':'rb'];gA.add(g);
  var curve=ribbon(r.pts,.14,.05,m,g);
  var ball=new THREE.Mesh(new THREE.SphereGeometry(.14,20,16),m);g.add(ball);
  var end=r.pts[r.pts.length-1],flag=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.7,10),M.brand);flag.position.set(end[0],.35,end[1]);g.add(flag);
  routeObjs[k]={g:g,curve:curve,ball:ball,y:.2};
});

/* --- View B: dựng theo sơ đồ mô phỏng từ mặt đường vào hầm B1 và sảnh tầng 1 --- */
var gB=new THREE.Group();scene.add(gB);
function rb(x1,y1,x2,y2,h,m,y0){
  var a=D(x1,y1),b=D(x2,y2),base=y0||0;
  return box(b[0]-a[0],h,b[1]-a[1],(a[0]+b[0])/2,base+h/2,(a[1]+b[1])/2,m,gB);
}
function arrow(cx,cy,dir,m){
  var p=function(x,y){return D(x,y);};
  var tip=p(cx+dir*11,cy),b1=p(cx-dir*9,cy-8),b2=p(cx-dir*9,cy+8);
  poly([tip,b1,b2],.04,m,gB);
}
rb(10,10,510,410,.04,M.ground,-.04);
rb(437,110,464,375,.02,M.road);
rb(26,375,502,402,.02,M.road);
rb(52,193,437,213,.02,M.road);
rb(52,297,437,315,.02,M.road);
rb(74,86,311,193,.03,M.bsmt);
rb(80,168,311,190,.05,M.hl);
rb(312,140,437,158,.04,M.bld);
arrow(300,203,-1,M.rb);arrow(140,203,-1,M.rb);
arrow(135,306,1,M.rb);arrow(308,306,1,M.rb);
rb(65,233,263,277,.14,M.bld);
for(var sx=72;sx<=258;sx+=9){rb(sx,233,sx+2,277,.006,M.line,.14);}
for(var cr=0;cr<3;cr++)for(var ci=0;ci<8;ci++){
  if((ci+cr*3)%4===0)continue;
  var cp=D(92+ci*28,106+cr*23);
  box(.3,.15,.5,cp[0],.1,cp[1],M.tall,gB);
}
rb(68,38,458,70,2.6,M.tall);
rb(22,196,50,322,5.8,M.tall);
rb(53,321,183,346,3.8,M.brand);
for(var f=1;f<19;f++){rb(52.5,320.5,183.5,346.5,.02,M.line,f*3.8/19);}
rb(196,328,270,343,.55,M.bld);
rb(105,345.5,150,347.5,.5,M.line);

var routeB=(function(){
  var pts=CHECKIN.pts.map(function(a){return D(a[0],a[1]);});
  var curve=ribbon(pts,.14,.3,M.ra,gB);
  var ball=new THREE.Mesh(new THREE.SphereGeometry(.14,20,16),M.ra);gB.add(ball);
  var end=pts[pts.length-1],flag=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.9,10),M.ra);flag.position.set(end[0],.45,end[1]);gB.add(flag);
  return {curve:curve,ball:ball,y:.45};
})();

/* ---------- Nhãn và ghim ---------- */
var labelEls=[],pinEls=[];
LABELS.forEach(function(l){
  var el=document.createElement('div');el.className='lb'+(l.cls?' '+l.cls:'');el.textContent=l.n;labelsEl.appendChild(el);
  labelEls.push({el:el,v:new THREE.Vector3(l.p[0],l.p[1],l.p[2]),view:l.v});
});
function clearPins(){pinEls.forEach(function(p){p.el.remove();});pinEls=[];}
function addPin(n,vec,colorVar){
  var el=document.createElement('div');el.className='pin';el.textContent=n;el.dataset.c=colorVar;el.style.background=css(colorVar);labelsEl.appendChild(el);
  pinEls.push({el:el,v:vec});
}
var tmp=new THREE.Vector3();
function project(){
  var w=stage.clientWidth,h=stage.clientHeight;
  function place(o,show,dy){
    if(!show){o.el.style.display='none';return;}
    tmp.copy(o.v).project(camera);
    if(tmp.z>1||tmp.z<-1){o.el.style.display='none';return;}
    o.el.style.display='';
    var x=(tmp.x*.5+.5)*w,y=(-tmp.y*.5+.5)*h;
    o.el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,'+dy+')';
  }
  labelEls.forEach(function(o){place(o,o.view===view,'-110%');});
  pinEls.forEach(function(o){place(o,true,'-50%');});
}

/* ---------- Trạng thái, bước, camera ---------- */
var view='a',route='a',active=0,fly=null;
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var stepsEl=document.getElementById('steps'),chipsEl=document.getElementById('chips'),noteEl=document.getElementById('note'),metaEl=document.getElementById('meta');

function flyTo(p,t){if(reduce){camera.position.set(p[0],p[1],p[2]);controls.target.set(t[0],t[1],t[2]);return;}fly={p:new THREE.Vector3(p[0],p[1],p[2]),t:new THREE.Vector3(t[0],t[1],t[2])};}
controls.addEventListener('start',function(){fly=null;});

function curSteps(){return view==='a'?ROUTES[route].steps:CHECKIN.steps;}
function renderSteps(){
  var data=curSteps(),colorVar=view==='a'?ROUTES[route].color:'--ra';
  stepsEl.innerHTML='';clearPins();
  data.forEach(function(s,i){
    var li=document.createElement('li'),b=document.createElement('button');
    b.className='step';b.type='button';if(i===active)b.setAttribute('aria-current','true');
    b.innerHTML='<span class="num" data-c="'+colorVar+'">'+(i+1)+'</span><span><b></b><span class="d"></span></span>';
    b.querySelector('b').textContent=s.t;b.querySelector('.d').textContent=s.d;
    b.addEventListener('click',function(){goStep(i);});
    li.appendChild(b);stepsEl.appendChild(li);
    addPin(i+1,new THREE.Vector3(s.at[0],s.y||.7,s.at[1]),colorVar);
  });
  applyTheme();
}
function goStep(i){
  active=i;
  var s=curSteps()[i],o=s.off||(view==='a'?[2.5,3.8,4.6]:[1.6,3.4,4.2]);
  flyTo([s.at[0]+o[0],o[1],s.at[1]+o[2]],[s.at[0],0,s.at[1]]);
  renderSteps();
}
function renderChips(){
  chipsEl.innerHTML='';
  if(view!=='a')return;
  Object.keys(ROUTES).forEach(function(k){
    var b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',k===route?'true':'false');
    b.innerHTML='<i data-c="'+ROUTES[k].color+'"></i><span></span>';b.querySelector('span').textContent=ROUTES[k].name;
    b.addEventListener('click',function(){route=k;active=0;showRoutes();renderChips();renderSteps();overview();setMeta();});
    chipsEl.appendChild(b);
  });
}
function setMeta(){metaEl.textContent=view==='a'?ROUTES[route].meta:CHECKIN.meta;}
function showRoutes(){Object.keys(routeObjs).forEach(function(k){routeObjs[k].g.visible=(view==='a'&&k===route);});}
function overview(){if(view==='a')flyTo([-1,19,12],[-1,0,-4]);else flyTo([.5,13,11.5],[.3,0,.8]);}

function setView(v,skipHash){
  view=v;active=0;gA.visible=v==='a';gB.visible=v==='b';
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.view===v?'true':'false');});
  if(v==='a'){noteEl.textContent='Dựng lại từ ảnh chụp lộ trình Google Maps (đi xe máy). Vị trí các mốc mang tính tương đối. Hãy kiểm tra lại trên Google Maps trước khi đi.';}
  else{noteEl.textContent='Dựng lại từ sơ đồ mô phỏng của ban tổ chức, không theo đúng tỷ lệ. Khi ra về, xe đi theo lối đi ra ở phía dưới sơ đồ, mũi tên hướng về đường nội bộ.';}
  showRoutes();renderChips();renderSteps();overview();setMeta();
  if(!skipHash){try{history.replaceState(null,'',v==='a'?'#duong-den':'#check-in');}catch(e){}}
}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){setView(t.dataset.view);});});
function fromHash(){setView(location.hash==='#check-in'?'b':'a',true);}
window.addEventListener('hashchange',fromHash);

/* ---------- Vòng lặp ---------- */
function resize(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
var t0=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  if(fly){camera.position.lerp(fly.p,.07);controls.target.lerp(fly.t,.07);if(camera.position.distanceTo(fly.p)<.05)fly=null;}
  var ro=view==='a'?routeObjs[route]:routeB,u=reduce?1:(((now-t0)/1000)*(view==='a'?.045:.06))%1;
  ro.ball.position.copy(ro.curve.getPoint(u));ro.ball.position.y=ro.y;
  controls.update();renderer.render(scene,camera);project();
}
applyTheme();
var mq=window.matchMedia('(prefers-color-scheme: dark)');
if(mq.addEventListener)mq.addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
resize();camera.position.set(-1,19,12);controls.target.set(-1,0,-4);
fromHash();resize();requestAnimationFrame(loop);
})();
</script>

</body></html>
